<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>X返信候補</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #0f1419; --sub: #5b6670; --line: #e3e7eb;
    --accent: #1d9bf0; --accent-ink: #ffffff; --imp: #0b6bcb; --chip: #eef3f8;
    --done: #8a959e; --warn-bg: #fff4e0; --warn: #8a5300; --err-bg: #fdeaea; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e12; --card: #151a20; --text: #e7ecf0; --sub: #8b98a5; --line: #26303a;
      --accent: #1d9bf0; --accent-ink: #ffffff; --imp: #6cb8ff; --chip: #1c242d;
      --done: #5d6873; --warn-bg: #2d2412; --warn: #f0c27a; --err-bg: #2e1616; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .bar { display: flex; align-items: center; gap: 10px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  select { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  main { max-width: 680px; margin: 0 auto; padding: 12px 16px 60px; }
  .summary { color: var(--sub); font-size: 13px; margin: 2px 0 10px; }
  .summary b { color: var(--text); font-weight: 600; }
  .tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
           font-size: 13px; color: var(--sub); }
  .tools label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .banner { border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.err { background: var(--err-bg); color: var(--err); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card.done { opacity: .45; }
  .head { display: flex; align-items: center; gap: 10px; }
  .rank { flex: none; width: 28px; text-align: center; font-weight: 700; font-size: 16px; color: var(--sub); }
  .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--chip); object-fit: cover; }
  .who { min-width: 0; flex: 1; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--sub); font-size: 12.5px; overflow-wrap: anywhere; }
  .imp { flex: none; text-align: right; color: var(--imp); font-weight: 700; font-size: 17px;
         font-variant-numeric: tabular-nums; line-height: 1.2; }
  .imp small { display: block; font-size: 11px; font-weight: 500; color: var(--sub); }
  .text { margin: 8px 0 8px 38px; white-space: pre-wrap; word-break: break-word;
          display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .text.open { display: block; }
  .more { margin-left: 38px; background: none; border: 0; padding: 0; color: var(--accent); font: inherit;
          font-size: 13px; cursor: pointer; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px 38px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12.5px;
          font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; margin-left: 38px; }
  .btn { flex: 1; text-align: center; text-decoration: none; padding: 9px 0; border-radius: 10px;
         font-weight: 600; font-size: 14px; border: 1px solid var(--line); color: var(--text); background: var(--card); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.check { flex: none; width: 64px; cursor: pointer; font: inherit; font-weight: 600; font-size: 14px; }
  .card.done .btn.check { background: var(--done); color: #fff; border-color: var(--done); }
  .empty { text-align: center; color: var(--sub); padding: 60px 0; }
  @media (max-width: 420px) { .text, .stats, .actions, .more { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>返信候補</h1>
    <select id="runSel" aria-label="抽出回"></select>
  </div>
</header>
<main>
  <div id="summary" class="summary"></div>
  <div id="banner"></div>
  <div class="tools" id="tools" hidden>
    <span id="doneCount"></span>
    <label><input type="checkbox" id="hideDone"> 対応済みを隠す</label>
  </div>
  <div id="list"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let done = store.get('done', {});
let current = null;

const WD = ['日', '月', '火', '水', '木', '金', '土'];
function jst(iso) { return new Date(new Date(iso).getTime() + 9 * 3600e3); }  // 端末のタイムゾーンに依存せずJST表示
function fmtDate(iso) { const d = jst(iso);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WD[d.getUTCDay()]}) ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`; }
function fmtTime(iso) { const d = jst(iso);
  return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`; }
function ago(iso, base) { const m = Math.max(0, Math.round((new Date(base) - new Date(iso)) / 60000));
  return m < 60 ? `${m}分前` : `${Math.floor(m / 60)}時間前`; }
function num(n) { return n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1) + '万' : n.toLocaleString('ja-JP'); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function getJSON(path) {
  const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}

async function init() {
  let runs = [];
  try { runs = await getJSON('runs.json'); } catch (e) {}
  if (!runs.length) { $('list').replaceChildren(el('div', 'empty', 'まだ抽出結果がありません。最初の定時実行（6:00 / 18:00）をお待ちください。')); return; }
  const sel = $('runSel');
  for (const r of runs) {
    const o = el('option', null, `${fmtDate(r.run_at)}　${r.error ? '⚠️ 失敗' : r.count + '件'}`);
    o.value = r.id; sel.appendChild(o);
  }
  const want = new URLSearchParams(location.search).get('run');
  if (want && runs.some(r => r.id === want)) sel.value = want;
  sel.onchange = () => { history.replaceState(null, '', '?run=' + sel.value); load(sel.value); };
  $('hideDone').checked = store.get('hideDone', false);
  $('hideDone').onchange = (e) => { store.set('hideDone', e.target.checked); render(); };
  load(sel.value);
}

async function load(id) {
  $('list').replaceChildren(el('div', 'empty', '読み込み中…'));
  try { current = await getJSON(`runs/${id}.json`); }
  catch (e) { $('list').replaceChildren(el('div', 'empty', '読み込みに失敗しました')); return; }
  render();
}

function render() {
  const run = current, c = run.conditions || {}, s = run.stats;
  $('summary').innerHTML = '';
  const sum = $('summary');
  sum.append(el('b', null, `${fmtDate(run.window_start)} 〜 ${fmtTime(run.run_at)}`),
             ` の投稿｜表示${num(c.min_impressions || 0)}以上・返信${c.max_replies}以下・上位${c.top_n}件`);
  if (s) sum.append(el('br'), `取得 ${s.fetched}件 → 条件一致 ${s.matched}件｜API推定 $${s.est_cost_usd}`);

  const banner = $('banner'); banner.replaceChildren();
  if (run.error) banner.append(el('div', 'banner err', '⚠️ ' + run.error));
  else if (s && !s.reached_window) banner.append(el('div', 'banner warn', '取得上限に達したため、12時間分を最後まで取り切れていません（古い時間帯が抜けている可能性）。'));

  const posts = run.posts || [];
  const hide = $('hideDone').checked;
  const nDone = posts.filter(p => done[p.id]).length;
  $('tools').hidden = !posts.length;
  $('doneCount').textContent = `対応済み ${nDone} / ${posts.length}`;

  const list = $('list'); list.replaceChildren();
  if (!posts.length && !run.error) list.append(el('div', 'empty', '条件に合うポストはありませんでした。'));
  for (const p of posts) {
    if (hide && done[p.id]) continue;
    const card = el('article', 'card' + (done[p.id] ? ' done' : ''));

    const head = el('div', 'head');
    head.append(el('div', 'rank', p.rank));
    const av = el('img', 'avatar'); av.alt = ''; av.loading = 'lazy'; if (p.avatar) av.src = p.avatar;
    const who = el('div', 'who');
    who.append(el('div', 'name', p.name || p.username),
               el('div', 'meta', `@${p.username} · ${fmtTime(p.created_at)} · ${ago(p.created_at, run.run_at)}${p.is_quote ? ' · 引用' : ''}`));
    const imp = el('div', 'imp', num(p.impressions)); imp.append(el('small', null, '表示'));
    head.append(av, who, imp);

    const text = el('div', 'text', p.text);
    const stats = el('div', 'stats');
    stats.append(el('span', 'chip', `💬 ${p.replies}`), el('span', 'chip', `❤️ ${num(p.likes)}`),
                 el('span', 'chip', `🔁 ${num(p.retweets)}`), el('span', 'chip', `🔖 ${num(p.bookmarks)}`));

    const actions = el('div', 'actions');
    const reply = el('a', 'btn primary', '返信する'); reply.href = p.reply_url; reply.target = '_blank'; reply.rel = 'noopener';
    const open = el('a', 'btn', 'ポストを開く'); open.href = p.url; open.target = '_blank'; open.rel = 'noopener';
    const chk = el('button', 'btn check', done[p.id] ? '済 ✓' : '済');
    chk.onclick = () => { if (done[p.id]) delete done[p.id]; else done[p.id] = Date.now(); store.set('done', done); render(); };
    actions.append(reply, open, chk);

    card.append(head, text);
    requestAnimationFrame(() => { if (text.scrollHeight > text.clientHeight + 2) {
      const more = el('button', 'more', 'もっと見る');
      more.onclick = () => { text.classList.add('open'); more.remove(); };
      text.after(more);
    } });
    card.append(stats, actions);
    list.append(card);
  }
}
init();
</script>
</body>
</html>
